<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#3B2A20"/>
  <!-- Hairline serifs -->
  <rect x="10" y="14" width="18" height="1.6" fill="#F4EFE8"/>
  <rect x="36" y="14" width="18" height="1.6" fill="#F4EFE8"/>
  <!-- Left diagonal stroke (slight Didone thickness) -->
  <polygon points="15,15.6 24,15.6 33,48 31,48" fill="#F4EFE8"/>
  <!-- Right diagonal stroke -->
  <polygon points="40,15.6 49,15.6 33,48 31,48" fill="#F4EFE8"/>
  <!-- Bottom serif (thin terminal) -->
  <rect x="29.5" y="48" width="5" height="1.4" fill="#F4EFE8"/>
</svg>
